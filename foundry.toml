[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc = '0.8.28'
optimizer = true
optimizer_runs = 200
auto_detect_solc = false
evm_version = "shanghai"

# DeployBscMainnet writes deployment artifacts to deployments/
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Remappings are part of the contract metadata hash. This exact list reproduces the bytecode
# deployed on BSC Mainnet, so auto-detection is disabled and unused entries are kept.
auto_detect_remappings = false
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "account-abstraction/=lib/account-abstraction/",
  "ds-test/=lib/openzeppelin-contracts/lib/forge-std/lib/ds-test/src/",
  "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
  "forge-std/=lib/forge-std/src/",
  "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "openzeppelin/=lib/openzeppelin-contracts/contracts/",
  # EntryPoint v0.7 targets OZ 5 (utils/ReentrancyGuard); OZ 4.9.6 keeps it in security/.
  # Needed only to compile the real EntryPoint in test/AuditFixes.t.sol.
  "lib/account-abstraction/:@openzeppelin/contracts/utils/ReentrancyGuard.sol=lib/openzeppelin-contracts/contracts/security/ReentrancyGuard.sol"
]

# Named RPC endpoints. Set *_RPC_URL in .env or export before forge run.
[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
bsc_mainnet = "${BSC_MAINNET_RPC_URL}"

[fmt]
line_length = 100

# Exclude problematic files
ignore = [
  "lib/openzeppelin-contracts/contracts/utils/cryptography/MessageHashUtils.sol"
]